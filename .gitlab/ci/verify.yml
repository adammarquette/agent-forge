# -----------------------------------------------------------------------------
# VERIFY stage - post-deploy smoke test. Confirms the freshly deployed
# staging environment is actually serving requests (mirrors
# agent-forge-copilot's verify.yml /health retry-loop pattern), rather than
# treating a green `railway up` as proof the app is reachable - openemr.sh's
# first-boot auto_configure.php run can take several minutes, and a deploy
# job returning success only means Railway accepted the upload.
#
# Requires a `STAGING_URL` CI/CD variable (plain, not masked - it's a public
# login page URL, not a secret) set to the staging environment's Railway
# domain for the `openemr` service. See docs/CI-SETUP.md and
# docs/DEPLOYMENT.md.
#
# curl -L: Railway's edge / OpenEMR itself redirects the bare request
# (confirmed live: HTTP 301 on every attempt without -L) before reaching the
# actual login page, so following redirects is required to see the real
# final status instead of always observing the redirect's own 3xx.
# --max-redirs bounds it so a redirect loop fails fast instead of hanging.
# -----------------------------------------------------------------------------

verify:staging:
  stage: verify
  image: curlimages/curl:latest
  interruptible: false
  needs: ["deploy:staging"]
  environment:
    name: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      for i in $(seq 1 30); do
        code=$(curl -s -L --max-redirs 5 -o /dev/null -w "%{http_code}" "${STAGING_URL}/interface/login/login.php?site=default")
        if [ "$code" = "200" ]; then
          echo "Login page reachable (HTTP $code) after $i attempt(s)"
          exit 0
        fi
        echo "Attempt $i/30: HTTP $code, retrying in 10s..."
        sleep 10
      done
      echo "Login page never became reachable after 30 attempts"
      exit 1
