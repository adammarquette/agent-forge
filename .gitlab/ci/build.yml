# -----------------------------------------------------------------------------
# BUILD stage - builds the fork's actual deploy image once (docker/railway/
# Dockerfile) and tags the CI tooling image (the openemr-ci target, full dev
# dependencies included) locally, so lint and test can reference it by name
# instead of rebuilding, and every stage runs against byte-identical PHP 8.5
# + extension parity with what actually deploys.
#
# build:production-image is a pure validation gate, not an artifact any
# later stage consumes - deploy still lets Railway build its own copy
# server-side (railway up uploads source; Railway's Metal builder rebuilds
# it independently). This job exists so a Dockerfile regression (buildkit
# cache-mount syntax, VOLUME directives, CRLF-corrupted COPY'd scripts - see
# agent-forge#3, #6, #7) fails the pipeline the moment it's pushed, instead
# of being discovered live on Railway hours later.
#
# Docker-outside-of-Docker, not Docker-in-Docker: the runner's self-hosted
# Windows/Docker-Desktop host doesn't reliably create the per-build network
# GitLab Runner needs to auto-alias a `docker:27-dind` service ("lookup
# docker ... no such host" against Docker Desktop's own VM subnet, not the
# per-job network). Talking to the host's own Docker daemon via the bind-
# mounted socket (config.toml's [runners.docker] volumes) skips that layer
# entirely instead of debugging DinD's networking on this platform.
#
# No Container Registry push/pull: this GitLab instance doesn't have one
# configured (CI_REGISTRY/CI_REGISTRY_IMAGE come back empty even though the
# project's own container_registry_enabled flag is true - an instance-admin
# gap, not fixable from here). Since every job in this pipeline runs through
# the same single self-hosted runner sharing one Docker daemon (the DooD
# socket above), the image built here already stays in that daemon's local
# store - lint/test reference it by name directly (see lint.yml/test.yml's
# pull_policy: never) instead of round-tripping through a registry.
# -----------------------------------------------------------------------------

.docker_build: &docker_build
  image: docker:27
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"

build:ci-image:
  stage: build
  <<: *docker_build
  script:
    - docker build -f docker/railway/Dockerfile --target openemr-ci -t "openemr-ci:$CI_COMMIT_SHORT_SHA" .

build:production-image:
  stage: build
  <<: *docker_build
  script:
    - docker build -f docker/railway/Dockerfile -t "openemr-production:$CI_COMMIT_SHORT_SHA" .
