# -----------------------------------------------------------------------------
# DEPLOY stage - promotes main to Railway. See docs/DEPLOYMENT.md for the
# one-time Railway/GitLab setup this depends on.
#
# Single-environment model (mirrors agent-forge-copilot's deploy.yml):
# everything runs in the Railway "staging" environment, project lucid-clarity,
# service "openemr". This repo originally documented a three-tier
# development/sdet/production promotion model, but Railway's actual project
# only ever had two environments (staging, development), and the working
# fork build has lived in "staging" since 2026-07-10 -- development's
# "openemr-Uubp" service was a dead end (container started, produced zero
# log output, killed on healthcheck timeout; see agent-forge#8's 2026-07-10
# update). Collapsing to the one environment that's actually real avoids
# maintaining deploy jobs against tokens/environments that don't exist.
#
# Variable reassertion: PORT and SWARM_MODE are fixed, non-secret deploy
# requirements (docs/DEPLOYMENT.md #1.3/#5) - hardcoded here rather than
# stored as CI/CD variables so there's nothing to keep in sync. OE_PASS and
# MYSQL_PASS are real secrets and stay in GitLab's CI/CD variables;
# `railway variable set --skip-deploys` reasserts them immediately before
# `railway up` so a value edited only in the Railway dashboard (and not
# back-ported to GitLab) can't silently drift out of sync between the two
# places - the discrepancy this is a workaround for is in
# agent-forge-copilot's deploy.yml (Llm__ApiKey drift caused a full session
# of 401s).
# -----------------------------------------------------------------------------

deploy:staging:
  stage: deploy
  image: ghcr.io/railwayapp/cli:latest
  interruptible: false
  variables:
    GIT_DEPTH: "1"
    RAILWAY_TOKEN: $RAILWAY_TOKEN_STAGING
  environment:
    name: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - railway variable set PORT=80 --service "$RAILWAY_SERVICE" --skip-deploys
    - railway variable set SWARM_MODE=yes --service "$RAILWAY_SERVICE" --skip-deploys
    - railway variable set "OE_PASS=$OE_PASS" --service "$RAILWAY_SERVICE" --skip-deploys
    - railway variable set "MYSQL_PASS=$MYSQL_PASS" --service "$RAILWAY_SERVICE" --skip-deploys
    - railway up --service "$RAILWAY_SERVICE" --ci
