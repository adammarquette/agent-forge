# =============================================================================
# GitLab CI/CD -> Railway deployment pipeline (agent-forge / OpenEMR)
# =============================================================================
# Pipeline entry point - see docs/CI-SETUP.md for the full explanation of this
# structure and the one-time GitLab project-settings steps it depends on.
# Per-stage jobs live under .gitlab/ci/, mirroring agent-forge-copilot's
# structure (agent-forge#8).
#
# Single-environment model (mirrors agent-forge-copilot): push to main
# auto-deploys to Railway's "staging" environment. An earlier version of
# this file described a three-tier development/sdet/production promotion
# model, but Railway's project only ever had two environments
# (staging/development) - collapsed to the one that's actually real, see
# agent-forge#8's 2026-07-10 update.
#
# Required CI/CD variables (Settings -> CI/CD -> Variables, masked):
#   RAILWAY_TOKEN          - Railway project token scoped to "staging"
#   OE_PASS, MYSQL_PASS    - environment-scoped (Settings -> CI/CD ->
#                            Variables -> set "Environment scope" to staging)
#   STAGING_URL            - plain (not masked) - the staging environment's
#                            Railway domain, used only by the verify stage's
#                            post-deploy smoke test
#
# See docs/DEPLOYMENT.md for the full Railway setup runbook and
# docs/CI-SETUP.md for this pipeline's structure and rationale.
# =============================================================================

stages:
  - build
  - lint
  - test
  - deploy
  - verify
  - cleanup

variables:
  # Name of the Railway service that receives this repo's deploys. Must match
  # the actual service name in the Railway dashboard exactly.
  RAILWAY_SERVICE: openemr

# Pipelines run on merge requests (lint/build/test feedback before merge) and
# on pushes to the default branch (full suite + auto-deploy to staging).
# Without this, every feature-branch push would ALSO trigger a pipeline that
# then runs again once the MR opens - the same commits tested twice on every
# change (see agent-forge-copilot's .gitlab-ci.yml comment re: their issue #40).
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

include:
  - local: ".gitlab/ci/lint.yml"
  - local: ".gitlab/ci/build.yml"
  - local: ".gitlab/ci/test.yml"
  - local: ".gitlab/ci/deploy.yml"
  - local: ".gitlab/ci/verify.yml"
  - local: ".gitlab/ci/cleanup.yml"
