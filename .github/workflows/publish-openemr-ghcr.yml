# -----------------------------------------------------------------------------
# main pipeline: verify the fork, publish its image to GHCR, deploy it to Railway.
#
# The published image is THIS FORK, not stock OpenEMR. Alongside the
# `oe-module-agentforge` custom module it carries core patches the SMART EHR
# launch depends on - src/Common/Session/SessionUtil.php (the launch-bridge
# cookie), src/RestControllers/AuthorizationController.php, library/auth.inc.php -
# so stock openemr/openemr plus the module dropped on top will NOT reproduce a
# working launch. Publishing the built fork is what lets consumers (notably
# agent-forge-copilot's docker-compose) stand up a working demo with one command.
#
# WHY THE GATE IS JOBS IN ONE WORKFLOW, not `workflow_run` after a separate CI:
# this fork inherited 53 workflows from upstream OpenEMR and every one of them is
# filtered to `master` / `rel-*`. The fork's default branch is `main`, so none has
# ever run here - there was no green pipeline on `main` to chain from. Expressing
# the gate as `needs:` keeps it in one place and avoids workflow_run's quirks
# (it only dispatches from the default branch, and silently never fires when the
# upstream workflow does not run).
#
# WHAT IS AND IS NOT GATED. `php-syntax-check` runs the repo's own composer script
# and needs no vendor tree, so it is a cheap, reliable hard gate. The heavier
# gates the retired GitLab pipeline also ran - phpcs (PSR-12), phpstan (level 10),
# rector --dry-run - are deliberately NOT wired in yet: they need a full
# `composer install` against ~30 PHP extensions, and phpstan on this codebase
# legitimately exceeds Composer's 300s process timeout (the retired GitLab lint
# stage worked around it by calling vendor/bin/phpstan directly - docs/CI-SETUP.md
# records that and the rest of what re-adding these gates needs).
# Adding them unverified risks a permanently red `main` that never publishes,
# which would defeat the point. Add them deliberately, one at a time, confirming
# each is green before it becomes blocking.
#
# ONE-TIME MANUAL STEP AFTER THE FIRST SUCCESSFUL PUBLISH: a new GHCR package is
# PRIVATE by default, so anonymous `docker pull` - the whole point for a public
# demo - fails until you set it public in
# Settings -> Packages -> agent-forge -> Package settings -> Change visibility.
#
# DEPLOY LIVES HERE TOO, as of this commit. The GitLab pipeline that used to
# deploy this app (.gitlab-ci.yml + .gitlab/ci/) is retired and deleted; its
# deploy and verify stages are ported to the deploy-staging and verify-staging
# jobs at the bottom of this file. Those two are gated on a repo variable and
# stay skipped until Railway credentials are configured - see
# docs/DEPLOYMENT.md section 2.
# -----------------------------------------------------------------------------

name: main pipeline (verify + publish + deploy)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a publish midway - a half-pushed tag set is worse than a slow
# queue. PR runs are cancellable.
concurrency:
  group: main-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # VERIFY - runs on pull requests too, so the gate is exercised before it ever
  # guards a publish. (The publish job below is the only main-only piece.)
  # ---------------------------------------------------------------------------
  php-syntax:
    name: php syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      # Lint every tracked PHP file. `php -l` checks ONE file per invocation -
      # passing it several silently lints only the first - so this is strictly
      # one file per process (the repo's own `php-syntax-check` composer script
      # batches via `xargs php -l` and therefore only actually checks a handful
      # of files; not fixed here, but not relied upon either). One-process-per-
      # file across the whole tree is slow serially, so it runs -P parallel.
      # No vendor tree or composer install needed - pure `php -l`.
      - name: Lint every tracked PHP file
        run: |
          set -euo pipefail
          count=$(git ls-files '*.php' | wc -l)
          echo "Linting ${count} tracked PHP files..."
          # One `php -l` per file (it only lints the first arg if given several),
          # run -P parallel because one-process-per-file is slow serially. php -l
          # exits nonzero on a syntax error and prints the parse error to stderr;
          # xargs then returns 123, which `set -e` turns into a failed step. stdout
          # (the per-file "No syntax errors detected" chatter) is dropped as noise.
          # No vendor tree or composer install needed - pure php -l.
          git ls-files -z '*.php' \
            | xargs -0 -P"$(nproc)" -n1 php -d error_reporting=0 -l >/dev/null
          echo "All ${count} tracked PHP files parse."

  build-verify:
    name: build image + verify it is the fork
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # Built to the local daemon, not pushed: the verification below must run
      # against the exact artifact that would be published. Single-platform on
      # purpose - `load: true` cannot load a multi-platform manifest, and the
      # deploy target is amd64.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/railway/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ci-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the fork's changes are in the image
        env:
          # The FINAL image serves from the Apache docroot, NOT /openemr: the build
          # stages assemble at /openemr and then `mv openemr /var/www/localhost/htdocs/`
          # relocates it (docker/railway/Dockerfile). Asserting /openemr would fail
          # every run and publish nothing. Keep in step with that Dockerfile's WORKDIR.
          WEBROOT: /var/www/localhost/htdocs/openemr
        run: |
          set -euo pipefail
          img="${IMAGE}:ci-candidate"
          fail=0

          check_file() {
            if docker run --rm --entrypoint sh "$img" -c "test -e '$1'"; then
              echo "  OK      $1"
            else
              echo "  MISSING $1"; fail=1
            fi
          }

          echo "AgentForge custom module:"
          check_file "$WEBROOT/interface/modules/custom_modules/oe-module-agentforge/moduleConfig.php"
          check_file "$WEBROOT/interface/modules/custom_modules/oe-module-agentforge/public/launch.php"

          echo "Core files the launch depends on:"
          check_file "$WEBROOT/src/Common/Session/SessionUtil.php"
          check_file "$WEBROOT/src/RestControllers/AuthorizationController.php"

          # Presence alone proves nothing for the core files - stock OpenEMR ships
          # them too. Assert the fork's actual modification, so an image that was
          # accidentally built from upstream source cannot pass. docker/release's
          # Dockerfile clones upstream openemr/openemr rather than using this repo,
          # and that mistake would otherwise yield a healthy-looking STOCK image
          # that only fails later, at SMART launch, far from its cause.
          echo "Fork-specific core patch:"
          if docker run --rm --entrypoint sh "$img" -c \
              "grep -q 'EhrLaunchBridge\|ehr_launch_bridge' '$WEBROOT/src/Common/Session/SessionUtil.php'"; then
            echo "  OK      SessionUtil carries the EHR launch-bridge change"
          else
            echo "  MISSING SessionUtil looks like stock OpenEMR - the fork's launch patch is absent"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Image is missing the fork's changes; refusing to publish."
            exit 1
          fi
          echo "Verified: the image carries this fork's module and core changes."

  # ---------------------------------------------------------------------------
  # PUBLISH - only after the whole pipeline above is green, and only on main.
  # Rebuilds from the buildx GHA cache the verify job just populated, so this is
  # a cache hit rather than a second full build.
  # ---------------------------------------------------------------------------
  publish:
    name: publish to GHCR
    runs-on: ubuntu-24.04
    needs: [php-syntax, build-verify]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: echo "sha=sha-$(echo "${GITHUB_SHA}" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/railway/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}
          cache-from: type=gha

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo '```'
            echo "docker pull ${IMAGE}:latest"
            echo '```'
            echo ""
            echo "| Tag | |"
            echo "|---|---|"
            echo "| \`latest\` | moves with main |"
            echo "| \`main\` | moves with main |"
            echo "| \`${{ steps.tags.outputs.sha }}\` | immutable - pin demos to this |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # DEPLOY - push main to Railway's `staging` environment. This replaces the
  # retired GitLab pipeline's deploy:staging job (.gitlab/ci/deploy.yml), which
  # is what deployed this app until 2026-07-17; between that date and this job
  # landing there was no path from a merge to a running staging app at all.
  #
  # WHY `railway up` AND NOT THE IMAGE THE PUBLISH JOB JUST PUSHED. Deploying
  # the exact artifact build-verify checked would be better, but Railway offers
  # no project-token path to it. Pointing the service at :sha-<sha> means
  # rewriting the service's image source on every run (serviceInstanceUpdate),
  # an account-scoped API call a deploy-scoped project token cannot make.
  # `railway redeploy` sidesteps the token problem but reuses the existing
  # build instead of re-resolving a moved tag, so it can silently redeploy the
  # PREVIOUS image and report success. `railway up` uploads this commit's
  # source and Railway builds it with docker/railway/Dockerfile per
  # railway.json - the same Dockerfile, from the same commit, as the image
  # published above. It costs a second build; it cannot deploy something stale.
  # Revisit if this service is ever switched to an image source.
  #
  # GATED ON A REPO VARIABLE, NOT A SECRET: a job-level `if:` cannot read the
  # `secrets` context, and an ungated deploy job would fail every run until the
  # credentials exist. Set RAILWAY_STAGING_ENABLED=true (Settings -> Secrets
  # and variables -> Actions -> Variables) once the secrets are in place.
  # Needs: secrets RAILWAY_TOKEN_STAGING, OE_PASS, MYSQL_PASS; variable
  # STAGING_URL. Full setup in docs/DEPLOYMENT.md section 2.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: deploy to Railway staging
    runs-on: ubuntu-24.04
    needs: [publish]
    if: vars.RAILWAY_STAGING_ENABLED == 'true'
    # Records the deploy under the repo's Environments tab - the replacement
    # for GitLab's Operate -> Environments view of what commit is live.
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      # The Railway CLI auto-reads RAILWAY_TOKEN. The secret keeps the
      # -STAGING suffix it had in GitLab, for parity with agent-forge-copilot
      # and to leave the unsuffixed name free for a future dev-tier token.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
      RAILWAY_SERVICE: openemr
    steps:
      - uses: actions/checkout@v5

      # npm rather than the ghcr.io/railwayapp/cli container the GitLab job
      # used: that image is musl-based, and a `container:` job cannot run
      # actions/checkout there (the runner injects a glibc node binary).
      # Pinned to a major so a CLI release cannot change deploy behaviour
      # under us without a commit here.
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5

      # PORT and SWARM_MODE are fixed, non-secret deploy requirements
      # (docs/DEPLOYMENT.md sections 1.3 and 5) - hardcoded here rather than
      # stored as CI variables so there is nothing to keep in sync. OE_PASS
      # and MYSQL_PASS are real secrets; reasserting them immediately before
      # the deploy is what stops a value edited only in the Railway dashboard
      # from drifting away from the one CI believes is set.
      - name: Reassert deploy-critical variables
        env:
          OE_PASS: ${{ secrets.OE_PASS }}
          MYSQL_PASS: ${{ secrets.MYSQL_PASS }}
        run: |
          set -euo pipefail
          railway variable set PORT=80 --service "$RAILWAY_SERVICE" --skip-deploys
          railway variable set SWARM_MODE=yes --service "$RAILWAY_SERVICE" --skip-deploys

          # Guarded on non-empty, and set via --stdin. The GitLab job passed
          # `KEY=$SECRET` on the command line unconditionally, which both put
          # the value in the process argument list and would have overwritten
          # a working Railway password with an empty string had the CI
          # variable ever gone missing. A missing secret here warns and leaves
          # Railway's existing value alone.
          set_secret() {
            name="$1"; value="$2"
            if [ -z "$value" ]; then
              echo "::warning::${name} secret is not set; leaving the Railway value unchanged"
              return 0
            fi
            printf '%s' "$value" \
              | railway variable set "$name" --stdin --service "$RAILWAY_SERVICE" --skip-deploys
            echo "Reasserted ${name}"
          }
          set_secret OE_PASS "${OE_PASS:-}"
          set_secret MYSQL_PASS "${MYSQL_PASS:-}"

      # --ci streams build logs and exits when the BUILD finishes - it does not
      # wait for the container to become healthy. verify-staging below is what
      # establishes that the app actually serves traffic.
      - name: Deploy
        run: railway up --service "$RAILWAY_SERVICE" --ci

  # ---------------------------------------------------------------------------
  # VERIFY - post-deploy smoke test, ported from .gitlab/ci/verify.yml. A green
  # deploy job only means Railway accepted and built the upload; openemr.sh's
  # first-boot auto_configure.php run can take several minutes before the app
  # answers requests at all.
  #
  # curl -L: the bare request is redirected (HTTP 301) before reaching the
  # login page, so without following redirects this would only ever observe the
  # redirect's own 3xx. --max-redirs bounds it so a redirect loop fails fast
  # rather than hanging. A connection failure makes curl exit nonzero with no
  # code on stdout, hence the `|| echo 000` - without it `set -e` would abort
  # the whole step on the first attempt, defeating the retry loop.
  # ---------------------------------------------------------------------------
  verify-staging:
    name: smoke-test staging
    runs-on: ubuntu-24.04
    needs: [deploy-staging]
    steps:
      - name: Poll the login page
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          set -euo pipefail
          if [ -z "${STAGING_URL:-}" ]; then
            echo "::error::STAGING_URL variable is not set - cannot smoke-test the deploy."
            exit 1
          fi
          target="${STAGING_URL%/}/interface/login/login.php?site=default"
          echo "Polling ${target}"
          for i in $(seq 1 30); do
            code=$(curl -s -L --max-redirs 5 -o /dev/null -w "%{http_code}" "$target" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Login page reachable (HTTP ${code}) after ${i} attempt(s)"
              exit 0
            fi
            echo "Attempt ${i}/30: HTTP ${code}, retrying in 10s..."
            sleep 10
          done
          echo "::error::Login page never became reachable after 30 attempts (5 minutes)."
          exit 1
