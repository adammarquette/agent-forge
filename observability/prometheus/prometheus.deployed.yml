# Scrape config for a CONTAINERIZED sidecar: Prometheus running as a container alongside it,
# reaching it over the private container network. Used by observability/prometheus/Dockerfile, which
# both the deployed tier and docker-compose.observability.yml build.
# (prometheus.yml, used by observability/docker-compose.yml, instead scrapes a `dotnet run`
# sidecar on the host via host.docker.internal:5113.)
#
# THIS FILE IS A TEMPLATE. The image COPYs it to prometheus.template.yml and docker-entrypoint.sh
# renders SIDECAR_TARGET over the address below. To point it somewhere else, SET SIDECAR_TARGET -
# do not edit the address here, because the entrypoint's sed matches it literally and would then
# silently no-op (which its fail-closed check turns into a refusal to start).
#
# THE TARGET IS `reverse-proxy`, NOT `agent-forge-api`, AND THAT IS THE SIDECAR. Under compose
# the sidecar runs in the proxy's network namespace, so it answers on the proxy's name at its
# own port and has no DNS name of its own (DEPLOYMENT.md §2). :8081 is Kestrel
# directly - it does not traverse nginx, so /metrics is scraped unprefixed exactly as before.
# reference: DEPLOYMENT.md, a separate change
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/agentforge-alerts.yml

scrape_configs:
  - job_name: agentforge-api
    metrics_path: /metrics
    static_configs:
      - targets: ["reverse-proxy:8081"]
